[package]
name = "explorer_ghost_cleaner"
version = "0.1.3"

license = "MIT OR Apache-2.0"
repository = "https://github.com/menndouyukkuri/explorer_ghost_cleaner"
authors = [
	"menndouyukkuri",
]

edition = "2024"
build = "build.rs"

publish = false

rust-version = "1.95"


[dependencies]
toml = "1.1"

serde = {
	version = "1.0",
	features = [
		"derive",
	],
}

tray-item = "0.10"
sysinfo = "0.39"

windows = {
	version = "0.62",
	features = [
		"Win32_Foundation",
		"Win32_UI_WindowsAndMessaging",
	],
}


[build-dependencies]
winres = "0.1"


[profile.speed-size]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "debuginfo"
